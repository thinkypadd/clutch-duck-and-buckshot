<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <linearGradient id="canyonSky" x1="0" y1="0" x2="0" y2="100%">
      <stop offset="0%" stop-color="#0a0c14"/>
      <stop offset="45%" stop-color="#241b2b"/>
      <stop offset="78%" stop-color="#5a2c24"/>
      <stop offset="100%" stop-color="#a65832"/>
    </linearGradient>
    <linearGradient id="hoodSheen" x1="0" y1="0" x2="0" y2="100%">
      <stop offset="0%" stop-color="#8c2b23"/>
      <stop offset="100%" stop-color="#4d1410"/>
    </linearGradient>
    <pattern id="pixelGrid" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="2" height="2" fill="#000" opacity="0.12"/>
      <rect x="2" y="2" width="2" height="2" fill="#000" opacity="0.12"/>
    </pattern>
  </defs>

  <!-- Sky -->
  <rect width="960" height="480" fill="url(#canyonSky)"/>

  <!-- Low-poly canyon mesa silhouettes -->
  <polygon points="0,270 90,230 180,250 290,195 410,240 540,185 660,235 770,205 870,245 960,215 960,330 0,330" fill="#1b1422"/>
  <polygon points="0,295 120,260 260,285 380,245 520,275 670,230 790,270 910,245 960,260 960,340 0,340" fill="#2a1a24"/>

  <!-- 3D Track perspective -->
  <polygon points="475,255 485,255 780,480 180,480" fill="#292830"/>
  <!-- Curbs -->
  <polygon points="465,255 475,255 180,480 120,480" fill="#c43228"/>
  <polygon points="485,255 495,255 840,480 780,480" fill="#ede6d8"/>
  <!-- Road dash marks -->
  <polygon points="478,258 482,258 484,272 476,272" fill="#ffb020"/>
  <polygon points="476,285 484,285 488,312 472,312" fill="#ffb020"/>
  <polygon points="471,332 489,332 495,380 465,380" fill="#ffb020"/>

  <!-- Rival car ahead (burning wreck / PSX low-poly wedge) -->
  <polygon points="460,252 500,252 516,274 444,274" fill="#1b1d24"/>
  <polygon points="468,238 492,238 498,252 462,252" fill="#2e3440"/>
  <circle cx="470" cy="272" r="5" fill="#e03e2d"/>
  <circle cx="490" cy="272" r="5" fill="#e03e2d"/>
  <!-- Fire and smoke puffs -->
  <circle cx="480" cy="235" r="9" fill="#ff7b1c" opacity="0.85"/>
  <circle cx="474" cy="224" r="13" fill="#ffb020" opacity="0.75"/>
  <circle cx="486" cy="214" r="16" fill="#3a3835" opacity="0.6"/>

  <!-- Hood with Bugcatcher Blower (lowered into bottom third) -->
  <polygon points="180,390 780,390 890,480 70,480" fill="url(#hoodSheen)"/>
  <rect x="420" y="365" width="120" height="28" fill="#c4d0e6" stroke="#161820" stroke-width="2"/>
  <circle cx="446" cy="379" r="8" fill="#d93829"/>
  <circle cx="480" cy="379" r="8" fill="#d93829"/>
  <circle cx="514" cy="379" r="8" fill="#d93829"/>

  <!-- A-pillars & Roof header (framing the ~66% open windshield) -->
  <polygon points="0,0 55,0 72,480 0,480" fill="#15171e"/>
  <polygon points="905,0 960,0 960,480 888,480" fill="#15171e"/>
  <rect x="0" y="0" width="960" height="26" fill="#15171e"/>

  <!-- Top bar: live mirror and passenger visor station -->
  <!-- Live Rearview Mirror -->
  <rect x="375" y="14" width="150" height="42" fill="#12151c" stroke="#4a5264" stroke-width="2" rx="2"/>
  <rect x="382" y="20" width="136" height="30" fill="#1c2434"/>
  <!-- Mirror horizon reflection & tailgater headlights -->
  <polygon points="410,32 500,32 514,50 396,50" fill="#2d3342"/>
  <circle cx="438" cy="40" r="4" fill="#ffeb75"/>
  <circle cx="462" cy="40" r="4" fill="#ffeb75"/>
  <text x="450" y="11" font-family="'Courier New', monospace" font-size="9" fill="#ffb020" font-weight="bold" text-anchor="middle">LIVE REARVIEW MIRROR</text>

  <!-- Passenger Visor Weapon Station -->
  <rect x="580" y="14" width="280" height="52" fill="#26231e" stroke="#ffb020" stroke-width="2" rx="2"/>
  <rect x="592" y="24" width="140" height="20" fill="#3a4252" stroke="#14171d" stroke-width="1"/>
  <text x="662" y="38" font-family="'Courier New', monospace" font-size="10" fill="#f4efe6" font-weight="bold" text-anchor="middle">M1911 .45 [7/7]</text>
  <!-- Ammo Pouch slots -->
  <rect x="746" y="22" width="18" height="34" fill="#2c303c" stroke="#ffb020" stroke-width="1.5"/>
  <rect x="770" y="22" width="18" height="34" fill="#2c303c" stroke="#ffb020" stroke-width="1.5"/>
  <rect x="794" y="22" width="18" height="34" fill="#2c303c" stroke="#ffb020" stroke-width="1.5"/>
  <circle cx="832" cy="38" r="10" fill="#c9302c" stroke="#ffd24d" stroke-width="1.5"/>
  <text x="720" y="61" font-family="'Courier New', monospace" font-size="8" fill="#cbc1ab" text-anchor="middle">VISOR ARSENAL &amp; RELOAD</text>

  <!-- Lower Dashboard (native 2D proportions, leaves windshield open) -->
  <rect x="65" y="402" width="830" height="78" fill="#1a1e26" stroke="#485163" stroke-width="2"/>

  <!-- Gauge cluster (Behind left wheel) -->
  <rect x="110" y="375" width="170" height="60" fill="#0c0e13" stroke="#485163" stroke-width="2" rx="2"/>
  <circle cx="150" cy="405" r="18" fill="#141822" stroke="#ffb020" stroke-width="1.5"/>
  <line x1="150" y1="405" x2="162" y2="394" stroke="#ffb020" stroke-width="2.5"/>
  <text x="215" y="398" font-family="'Courier New', monospace" font-size="18" fill="#ffb020" font-weight="bold">142</text>
  <text x="252" y="398" font-family="'Courier New', monospace" font-size="10" fill="#cbc1ab">MPH</text>
  <text x="215" y="420" font-family="'Courier New', monospace" font-size="11" fill="#6be36b" font-weight="bold">GEAR 4/6</text>

  <!-- Steering Wheel (Left Driver side, 100% circular, not oval) -->
  <circle cx="200" cy="440" r="76" fill="none" stroke="#222630" stroke-width="22"/>
  <circle cx="200" cy="440" r="76" fill="none" stroke="#ffb020" stroke-width="3"/>
  <circle cx="200" cy="364" r="8" fill="#e03e2d"/>
  <circle cx="200" cy="440" r="16" fill="#151820" stroke="#ffb020" stroke-width="2"/>

  <!-- Center Console: Sliding H-Pattern Gearbox -->
  <rect x="390" y="396" width="140" height="74" fill="#252b36" stroke="#e8b944" stroke-width="2" rx="2"/>
  <!-- H-Slots -->
  <line x1="410" y1="432" x2="510" y2="432" stroke="#090a0d" stroke-width="6"/>
  <line x1="422" y1="412" x2="422" y2="452" stroke="#090a0d" stroke-width="6"/>
  <line x1="450" y1="412" x2="450" y2="452" stroke="#090a0d" stroke-width="6"/>
  <line x1="478" y1="412" x2="478" y2="452" stroke="#090a0d" stroke-width="6"/>
  <line x1="502" y1="432" x2="502" y2="452" stroke="#090a0d" stroke-width="6"/>
  <!-- Metallic shaft & Shift Knob -->
  <line x1="478" y1="418" x2="472" y2="400" stroke="#dbe4f5" stroke-width="4"/>
  <circle cx="472" cy="400" r="8" fill="#e8b944" stroke="#121418" stroke-width="2"/>
  <text x="460" y="390" font-family="'Courier New', monospace" font-size="9" fill="#e8b944" font-weight="bold" text-anchor="middle">H-SHIFTER</text>

  <!-- Passenger Nitro Handle & Recessed Trunk Trap -->
  <rect x="580" y="410" width="115" height="54" fill="#141822" stroke="#3898ff" stroke-width="2" rx="2"/>
  <text x="637" y="426" font-family="'Courier New', monospace" font-size="10" fill="#3898ff" font-weight="bold" text-anchor="middle">NITRO PULL</text>
  <rect x="600" y="432" width="75" height="14" fill="#3898ff" rx="2"/>
  <text x="637" y="443" font-family="'Courier New', monospace" font-size="8" fill="#0a0e16" font-weight="bold" text-anchor="middle">2X BOOST</text>

  <!-- Trunk countermeasure switch -->
  <rect x="730" y="410" width="120" height="54" fill="#1e1814" stroke="#ffb020" stroke-width="2" rx="2"/>
  <text x="790" y="428" font-family="'Courier New', monospace" font-size="10" fill="#ffb020" font-weight="bold" text-anchor="middle">TRUNK TRAP</text>
  <rect x="746" y="434" width="88" height="18" fill="#3b2416" stroke="#ff5533" stroke-width="1.5" rx="2"/>
  <text x="790" y="447" font-family="'Courier New', monospace" font-size="9" fill="#ffeb75" font-weight="bold" text-anchor="middle">[CALTROPS]</text>

  <!-- Side-look helper cues -->
  <rect x="80" y="180" width="80" height="28" fill="#12151c" stroke="#ffb020" stroke-width="1.5" rx="2"/>
  <text x="120" y="198" font-family="'Courier New', monospace" font-size="11" fill="#ffeb75" font-weight="bold" text-anchor="middle">&lt; [A/Q] PEEK</text>
  <rect x="800" y="180" width="80" height="28" fill="#12151c" stroke="#ffb020" stroke-width="1.5" rx="2"/>
  <text x="840" y="198" font-family="'Courier New', monospace" font-size="11" fill="#ffeb75" font-weight="bold" text-anchor="middle">PEEK [D/E] &gt;</text>

  <!-- Subtle dither -->
  <rect width="960" height="480" fill="url(#pixelGrid)" pointer-events="none"/>
</svg>
