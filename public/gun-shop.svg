<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <linearGradient id="armoryBg" x1="0" y1="0" x2="0" y2="100%">
      <stop offset="0%" stop-color="#0d1016"/>
      <stop offset="60%" stop-color="#171c26"/>
      <stop offset="100%" stop-color="#242c3d"/>
    </linearGradient>
    <pattern id="pegboardPattern" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#181d28"/>
      <circle cx="8" cy="8" r="1.8" fill="#0d1016"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="960" height="480" fill="url(#armoryBg)"/>

  <!-- Pegboard Wall (Backdrop for 8 weapons) -->
  <rect x="60" y="20" width="840" height="230" fill="url(#pegboardPattern)" stroke="#3e485e" stroke-width="2" rx="3"/>
  <rect x="60" y="20" width="840" height="24" fill="#121620"/>
  <text x="480" y="37" font-family="'Courier New', monospace" font-size="12" fill="#ffb020" font-weight="bold" text-anchor="middle">3D ARMORY PEGBOARD WALL (8 WEAPONS - CLICK TO INSPECT)</text>

  <!-- Weapon Plaques (Row 1: 4 guns) -->
  <!-- 1. M1911 -->
  <rect x="80" y="54" width="180" height="85" fill="#121620" stroke="#6be36b" stroke-width="2" rx="2"/>
  <text x="170" y="70" font-family="'Courier New', monospace" font-size="10" fill="#f4efe6" font-weight="bold" text-anchor="middle">M1911 .45 PISTOL</text>
  <rect x="115" y="80" width="70" height="14" fill="#3a4252"/>
  <rect x="155" y="94" width="12" height="24" fill="#5a3822"/>
  <text x="170" y="130" font-family="'Courier New', monospace" font-size="9" fill="#6be36b" font-weight="bold" text-anchor="middle">OWNED [PRIMARY]</text>

  <!-- 2. Sawed-Off 12G -->
  <rect x="280" y="54" width="180" height="85" fill="#121620" stroke="#ffb020" stroke-width="2" rx="2"/>
  <text x="370" y="70" font-family="'Courier New', monospace" font-size="10" fill="#f4efe6" font-weight="bold" text-anchor="middle">SAWED-OFF 12G</text>
  <rect x="310" y="80" width="80" height="12" fill="#3a4252"/>
  <polygon points="390,82 430,95 420,118 385,88" fill="#6e4226"/>
  <text x="370" y="130" font-family="'Courier New', monospace" font-size="9" fill="#ffb020" font-weight="bold" text-anchor="middle">PRICE: $320</text>

  <!-- 3. .357 Magnum -->
  <rect x="480" y="54" width="180" height="85" fill="#121620" stroke="#485163" stroke-width="1.5" rx="2"/>
  <text x="570" y="70" font-family="'Courier New', monospace" font-size="10" fill="#f4efe6" font-weight="bold" text-anchor="middle">.357 MAGNUM</text>
  <rect x="520" y="80" width="60" height="12" fill="#687285"/>
  <circle cx="560" cy="95" r="9" fill="#3a4252" stroke="#ffb020" stroke-width="1"/>
  <polygon points="570,95 595,118 580,122 560,102" fill="#5a3822"/>
  <text x="570" y="130" font-family="'Courier New', monospace" font-size="9" fill="#ffb020" font-weight="bold" text-anchor="middle">PRICE: $580</text>

  <!-- 4. Trench Pump 12G -->
  <rect x="680" y="54" width="200" height="85" fill="#121620" stroke="#485163" stroke-width="1.5" rx="2"/>
  <text x="780" y="70" font-family="'Courier New', monospace" font-size="10" fill="#f4efe6" font-weight="bold" text-anchor="middle">TRENCH PUMP 12G</text>
  <rect x="710" y="80" width="110" height="10" fill="#3a4252"/>
  <rect x="735" y="90" width="30" height="9" fill="#6e4226"/>
  <polygon points="810,84 855,95 845,116 805,88" fill="#6e4226"/>
  <text x="780" y="130" font-family="'Courier New', monospace" font-size="9" fill="#ffb020" font-weight="bold" text-anchor="middle">PRICE: $780</text>

  <!-- Row 2: Viper, Mares Leg, Draco AK, M79 Thumper -->
  <rect x="80" y="148" width="180" height="85" fill="#121620" stroke="#485163" stroke-width="1.5" rx="2"/>
  <text x="170" y="164" font-family="'Courier New', monospace" font-size="10" fill="#f4efe6" font-weight="bold" text-anchor="middle">VIPER 9MM SMG</text>
  <text x="170" y="222" font-family="'Courier New', monospace" font-size="9" fill="#ffb020" font-weight="bold" text-anchor="middle">PRICE: $950</text>

  <rect x="280" y="148" width="180" height="85" fill="#121620" stroke="#485163" stroke-width="1.5" rx="2"/>
  <text x="370" y="164" font-family="'Courier New', monospace" font-size="10" fill="#f4efe6" font-weight="bold" text-anchor="middle">MARES LEG .45-70</text>
  <text x="370" y="222" font-family="'Courier New', monospace" font-size="9" fill="#ffb020" font-weight="bold" text-anchor="middle">PRICE: $1350</text>

  <rect x="480" y="148" width="180" height="85" fill="#121620" stroke="#485163" stroke-width="1.5" rx="2"/>
  <text x="570" y="164" font-family="'Courier New', monospace" font-size="10" fill="#f4efe6" font-weight="bold" text-anchor="middle">DRACO 7.62 AK</text>
  <text x="570" y="222" font-family="'Courier New', monospace" font-size="9" fill="#ffb020" font-weight="bold" text-anchor="middle">PRICE: $1750</text>

  <rect x="680" y="148" width="200" height="85" fill="#121620" stroke="#485163" stroke-width="1.5" rx="2"/>
  <text x="780" y="164" font-family="'Courier New', monospace" font-size="10" fill="#f4efe6" font-weight="bold" text-anchor="middle">M79 40MM THUMPER</text>
  <text x="780" y="222" font-family="'Courier New', monospace" font-size="9" fill="#ffb020" font-weight="bold" text-anchor="middle">PRICE: $2300</text>

  <!-- Lower Workbench: 3X Zoomable Pixel Bench for 5 Mod Slots -->
  <rect x="60" y="265" width="840" height="195" fill="#10131a" stroke="#485163" stroke-width="2" rx="3"/>

  <!-- Left: 3X Zoom Weapon Canvas -->
  <rect x="80" y="280" width="380" height="165" fill="#141822" stroke="#333b4e" stroke-width="1.5" rx="2"/>
  <text x="95" y="300" font-family="'Courier New', monospace" font-size="11" fill="#ffb020" font-weight="bold">PIXEL WORKBENCH (3X SUBSYSTEM ZOOM + PAN)</text>
  <!-- Rendered M1911 with laser & compensator -->
  <rect x="130" y="340" width="180" height="32" fill="#2d3340" stroke="#0e1014" stroke-width="2"/>
  <rect x="110" y="342" width="22" height="28" fill="#586175" stroke="#ffb020" stroke-width="1.5"/>
  <line x1="110" y1="365" x2="30" y2="365" stroke="#ff3b30" stroke-width="2"/>
  <rect x="235" y="372" width="28" height="55" fill="#5a3822" stroke="#0e1014" stroke-width="2"/>
  <!-- Holographic reflex optic -->
  <rect x="180" y="322" width="40" height="18" fill="none" stroke="#6be36b" stroke-width="2"/>
  <circle cx="200" cy="331" r="3" fill="#6be36b"/>

  <!-- Right: 5 Upgrade Slots & Tier selector -->
  <!-- 5 slot pills -->
  <rect x="480" y="280" width="400" height="36" fill="#161b24" stroke="#333b4e" stroke-width="1.5" rx="2"/>
  <rect x="485" y="284" width="70" height="28" fill="#ffb020" rx="2"/>
  <text x="520" y="302" font-family="'Courier New', monospace" font-size="10" fill="#111317" font-weight="bold" text-anchor="middle">BARREL</text>
  <rect x="560" y="284" width="75" height="28" fill="#202634" stroke="#485163" stroke-width="1" rx="2"/>
  <text x="597" y="302" font-family="'Courier New', monospace" font-size="10" fill="#cbc1ab" font-weight="bold" text-anchor="middle">LOADER</text>
  <rect x="640" y="284" width="65" height="28" fill="#202634" stroke="#485163" stroke-width="1" rx="2"/>
  <text x="672" y="302" font-family="'Courier New', monospace" font-size="10" fill="#cbc1ab" font-weight="bold" text-anchor="middle">AMMO</text>
  <rect x="710" y="284" width="65" height="28" fill="#202634" stroke="#485163" stroke-width="1" rx="2"/>
  <text x="742" y="302" font-family="'Courier New', monospace" font-size="10" fill="#cbc1ab" font-weight="bold" text-anchor="middle">SIGHT</text>
  <rect x="780" y="284" width="75" height="28" fill="#202634" stroke="#485163" stroke-width="1" rx="2"/>
  <text x="817" y="302" font-family="'Courier New', monospace" font-size="10" fill="#cbc1ab" font-weight="bold" text-anchor="middle">ACTION</text>

  <!-- Tier list -->
  <rect x="480" y="324" width="400" height="75" fill="#141822" stroke="#333b4e" stroke-width="1" rx="2"/>
  <text x="495" y="344" font-family="'Courier New', monospace" font-size="11" fill="#f4efe6" font-weight="bold">T3: SUPPRESSOR / SPIKED BREACHER</text>
  <text x="495" y="362" font-family="'Courier New', monospace" font-size="10" fill="#6be36b">+38% DAMAGE, +22M RANGE &amp; THREADED MUZZLE</text>
  <text x="495" y="380" font-family="'Courier New', monospace" font-size="10" fill="#cbc1ab">OWNED (FREE TO EQUIP OR SWAP ANYTIME)</text>

  <!-- Action button -->
  <rect x="480" y="407" width="400" height="38" fill="#6be36b" rx="2"/>
  <text x="680" y="431" font-family="'Courier New', monospace" font-size="12" fill="#111317" font-weight="bold" text-anchor="middle">EQUIP OWNED MOD (FREE)</text>
</svg>
