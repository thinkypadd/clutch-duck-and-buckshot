<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141824"/>
      <stop offset="60%" stop-color="#2a202d"/>
      <stop offset="100%" stop-color="#5c2f24"/>
    </linearGradient>
    <linearGradient id="hoodGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9e2822"/>
      <stop offset="100%" stop-color="#5a1612"/>
    </linearGradient>
    <pattern id="ditherGrid" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="2" height="2" fill="#000000" opacity="0.15"/>
      <rect x="2" y="2" width="2" height="2" fill="#000000" opacity="0.15"/>
    </pattern>
  </defs>

  <!-- Sky & Horizon -->
  <rect width="1200" height="420" fill="url(#skyGrad)"/>

  <!-- Low Poly Distant Mesa & Mountain Silhouette -->
  <polygon points="0,260 120,210 240,240 380,180 520,230 680,170 820,225 960,195 1100,245 1200,210 1200,320 0,320" fill="#201824"/>

  <!-- PSX 3D Road Perspective -->
  <polygon points="600,240 608,240 980,420 220,420" fill="#2c2c34"/>
  <polygon points="590,240 600,240 220,420 160,420" fill="#c9302c"/>
  <polygon points="608,240 618,240 1040,420 980,420" fill="#f4efe6"/>
  <polygon points="603,242 605,242 607,260 601,260" fill="#ffb020"/>
  <polygon points="601,275 607,275 611,310 597,310" fill="#ffb020"/>
  <polygon points="596,335 612,335 618,390 590,390" fill="#ffb020"/>

  <!-- Car Hood + Chrome Bugcatcher Supercharger -->
  <polygon points="240,336 960,336 1080,420 120,420" fill="url(#hoodGrad)"/>
  <rect x="520" y="302" width="160" height="36" fill="#c5d0e6" stroke="#1a1e26" stroke-width="3"/>
  <circle cx="556" cy="320" r="10" fill="#e03e2d"/>
  <circle cx="600" cy="320" r="10" fill="#e03e2d"/>
  <circle cx="644" cy="320" r="10" fill="#e03e2d"/>

  <!-- Cockpit A-Pillars & Roof -->
  <polygon points="0,0 78,0 116,420 0,420" fill="#13151a"/>
  <polygon points="1122,0 1200,0 1200,420 1084,420" fill="#13151a"/>
  <rect x="0" y="0" width="1200" height="44" fill="#13151a"/>

  <!-- Dashboard Fascia -->
  <rect x="96" y="352" width="1008" height="68" fill="#1b1f27" stroke="#4a5263" stroke-width="2"/>

  <!-- Behind-Wheel Instrument Binnacle (Left Driver Side) -->
  <rect x="175" y="314" width="230" height="82" fill="#0c0e12" stroke="#4c5466" stroke-width="3"/>
  <text x="290" y="346" font-family="Courier, monospace" font-size="24" font-weight="bold" fill="#ffb020" text-anchor="middle">168 MPH [G5]</text>

  <!-- Left Driver Steering Wheel -->
  <circle cx="290" cy="396" r="128" fill="none" stroke="#22252c" stroke-width="32"/>
  <circle cx="290" cy="396" r="128" fill="none" stroke="#ffb020" stroke-width="4"/>
  <circle cx="290" cy="268" r="11" fill="#e03e2d"/>

  <!-- Center Console 1-6 + R H-Pattern Shifter -->
  <rect x="515" y="342" width="170" height="78" fill="#292e38" stroke="#e8b944" stroke-width="3"/>
  <line x1="540" y1="382" x2="660" y2="382" stroke="#090a0d" stroke-width="6"/>
  <line x1="548" y1="358" x2="548" y2="406" stroke="#090a0d" stroke-width="6"/>
  <line x1="588" y1="358" x2="588" y2="406" stroke="#090a0d" stroke-width="6"/>
  <line x1="628" y1="358" x2="628" y2="406" stroke="#090a0d" stroke-width="6"/>
  <line x1="658" y1="382" x2="658" y2="406" stroke="#090a0d" stroke-width="6"/>
  <circle cx="628" cy="360" r="12" fill="#e8b944" stroke="#111315" stroke-width="3"/>
  <text x="600" y="334" font-family="Courier, monospace" font-size="13" font-weight="bold" fill="#6be36b" text-anchor="middle">1-6 H-SHIFTER</text>

  <!-- Passenger Short-Throw Nitro Handle & Twin Gold Bottles -->
  <rect x="780" y="344" width="120" height="30" fill="#c9302c" stroke="#ffeb75" stroke-width="3"/>
  <text x="840" y="364" font-family="Courier, monospace" font-size="15" font-weight="bold" fill="#111315" text-anchor="middle">NITRO BOOST</text>
  <rect x="945" y="346" width="34" height="74" fill="#c99722" stroke="#14100d" stroke-width="2"/>
  <rect x="986" y="346" width="34" height="74" fill="#c99722" stroke="#14100d" stroke-width="2"/>

  <!-- Passenger Visor Weapon Rack & Ammo Pouch -->
  <rect x="750" y="28" width="350" height="76" fill="#3b352c" stroke="#ffb020" stroke-width="2"/>
  <rect x="772" y="44" width="155" height="22" fill="#4c5566"/>
  <rect x="900" y="44" width="38" height="44" fill="#6e4226"/>
  <text x="850" y="94" font-family="Courier, monospace" font-size="14" font-weight="bold" fill="#ffb020" text-anchor="middle">VISOR ARSENAL + RELOAD</text>
  <rect x="968" y="44" width="14" height="44" fill="#cf2d23" stroke="#ffd24d" stroke-width="2"/>
  <rect x="990" y="44" width="14" height="44" fill="#cf2d23" stroke="#ffd24d" stroke-width="2"/>
  <rect x="1012" y="44" width="14" height="44" fill="#3d4452" stroke="#ffb020" stroke-width="2"/>
  <rect x="1034" y="44" width="14" height="44" fill="#3d4452" stroke="#ffb020" stroke-width="2"/>
  <circle cx="1068" cy="66" r="14" fill="#232730" stroke="#ffd24d" stroke-width="2"/>

  <!-- Title Typography -->
  <text x="580" y="138" font-family="Impact, Charcoal, sans-serif" font-size="74" font-weight="bold" fill="#ffb020" text-anchor="middle" letter-spacing="4">CLUTCH &amp; BUCKSHOT</text>
  <text x="580" y="176" font-family="Courier, monospace" font-size="20" font-weight="bold" fill="#f4efe6" text-anchor="middle" letter-spacing="4">PSX DRIVE-BY COMBAT RACER | GARAGE &amp; ARSENAL</text>

  <!-- Pixel Dither Overlay -->
  <rect width="1200" height="420" fill="url(#ditherGrid)" pointer-events="none"/>
</svg>
