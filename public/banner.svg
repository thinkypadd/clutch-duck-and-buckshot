<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141824"/>
      <stop offset="60%" stop-color="#2a202d"/>
      <stop offset="100%" stop-color="#4a2d2a"/>
    </linearGradient>
    <linearGradient id="hoodGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9e2822"/>
      <stop offset="100%" stop-color="#5a1612"/>
    </linearGradient>
    <pattern id="ditherGrid" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="2" height="2" fill="#000000" opacity="0.15"/>
      <rect x="2" y="2" width="2" height="2" fill="#000000" opacity="0.15"/>
    </pattern>
  </defs>

  <!-- Sky & Horizon -->
  <rect width="1200" height="420" fill="url(#skyGrad)"/>
  
  <!-- Low Poly Distant Mountain Silhouette -->
  <polygon points="0,260 120,210 240,240 380,180 520,230 680,170 820,225 960,195 1100,245 1200,210 1200,320 0,320" fill="#201824"/>

  <!-- PSX 3D Road Perspective -->
  <polygon points="600,240 608,240 980,420 220,420" fill="#2c2c34"/>
  <!-- Road Curbs -->
  <polygon points="590,240 600,240 220,420 160,420" fill="#c9302c"/>
  <polygon points="608,240 618,240 1040,420 980,420" fill="#f4efe6"/>
  <!-- Road Center Dashes -->
  <polygon points="603,242 605,242 607,260 601,260" fill="#ffb020"/>
  <polygon points="601,275 607,275 611,310 597,310" fill="#ffb020"/>
  <polygon points="596,335 612,335 618,390 590,390" fill="#ffb020"/>

  <!-- Muscle Car Hood -->
  <polygon points="260,340 940,340 1080,420 120,420" fill="url(#hoodGrad)"/>
  <polygon points="460,340 740,340 790,420 410,420" fill="#420f0c"/>

  <!-- Cockpit Windshield Frame / A-Pillars -->
  <polygon points="0,0 80,0 120,420 0,420" fill="#13151a"/>
  <polygon points="1120,0 1200,0 1200,420 1080,420" fill="#13151a"/>
  <rect x="0" y="0" width="1200" height="48" fill="#13151a"/>

  <!-- Visor & Shotgun Silhouettes (Right) -->
  <rect x="760" y="32" width="340" height="74" fill="#2d261e" stroke="#ffb020" stroke-width="2"/>
  <rect x="780" y="46" width="160" height="20" fill="#4a5260"/>
  <rect x="910" y="46" width="40" height="46" fill="#6e3c1e"/>
  <text x="800" y="94" font-family="Courier, monospace" font-size="14" font-weight="bold" fill="#ffb020">SAWED-OFF 12G [HOLSTER]</text>

  <!-- Shell Loops -->
  <rect x="970" y="48" width="14" height="42" fill="#c9302c" stroke="#ffe082" stroke-width="2"/>
  <rect x="992" y="48" width="14" height="42" fill="#c9302c" stroke="#ffe082" stroke-width="2"/>
  <rect x="1014" y="48" width="14" height="42" fill="#c9302c" stroke="#ffe082" stroke-width="2"/>
  <rect x="1036" y="48" width="14" height="42" fill="#c9302c" stroke="#ffe082" stroke-width="2"/>
  <rect x="1058" y="48" width="14" height="42" fill="#c9302c" stroke="#ffe082" stroke-width="2"/>

  <!-- Steering Wheel Silhouette (Left) -->
  <circle cx="340" cy="380" r="140" fill="none" stroke="#22252c" stroke-width="36"/>
  <circle cx="340" cy="380" r="140" fill="none" stroke="#ffb020" stroke-width="4"/>
  <circle cx="340" cy="380" r="42" fill="#191b20" stroke="#4a505c" stroke-width="4"/>
  <!-- Top Marker on Wheel -->
  <circle cx="340" cy="240" r="12" fill="#e03e2d"/>

  <!-- Nitro T-Handle (Center-Right) -->
  <rect x="720" y="320" width="12" height="90" fill="#7a8291"/>
  <rect x="670" y="310" width="112" height="24" fill="#c9302c" stroke="#ffe082" stroke-width="3"/>
  <text x="726" y="327" font-family="Courier, monospace" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">NITRO 3X</text>

  <!-- Big Stylized Typography in Center Sky -->
  <text x="600" y="145" font-family="Impact, Charcoal, sans-serif" font-size="78" font-weight="bold" fill="#ffb020" text-anchor="middle" letter-spacing="4">CLUTCH &amp; BUCKSHOT</text>
  <text x="600" y="185" font-family="Courier, monospace" font-size="22" font-weight="bold" fill="#f4efe6" text-anchor="middle" letter-spacing="6">1-HAND PSX COMBAT RACER</text>

  <!-- Pixel Dither Overlay -->
  <rect width="1200" height="420" fill="url(#ditherGrid)" pointer-events="none"/>
</svg>
